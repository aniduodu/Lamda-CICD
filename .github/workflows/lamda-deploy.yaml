
name: Deploy AWS Lambda
on:
  push:
    branches:
      - main
    paths: 
        - 'Lambda/**'


  Jobs:
  deploy_lambda: # name of the job
    runs-on: ubuntu-latest  # set or specify the runner environment
    steps:
      - name: Checkout code 
        uses: actions/checkout@v3

      - name: Set up Python   # sets up the python environment for the lambda function
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies  # install any packages required for the lambda function
        run: |
          python -m pip install --upgrade pip    
          pip install -r Lambda/requirements.txt -t lambda/

      - name: configure AWS creds   # sets up out AWS credentials     
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }} 

      - name: Deploy Lambda function  #Zips lambda directory and update lambda function
        run: |
          cd Lambda
          zip -r deployment-package.zip 
          aws lambda update-function-code --function-name my-lambda-function --zip-file fileb://Lambda/deployment-package.zip --region $AWS_REGION